[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-triage"
version = "1.0.2"
description = "AI-powered CI failure analysis across Jenkins, GitHub Actions, and xcodebuild"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gerard Recinto", email = "gerardrecinto@gmail.com" }]
keywords = ["ci", "cd", "devops", "testing", "llm", "claude", "xcodebuild", "jenkins"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.40.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "anthropic>=0.40.0",
]

[project.scripts]
ci-triage = "ci_triage.cli:main"

[project.urls]
Homepage = "https://github.com/gerardrecinto/ci-triage"
Repository = "https://github.com/gerardrecinto/ci-triage"

[tool.hatch.build.targets.wheel]
packages = ["src/ci_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/ci_triage"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
