name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "src/ci_triage/**", "tests/fixtures/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p _site/py/parsers _site/py/classifiers _site/logs
          cp site/index.html _site/
          cp src/ci_triage/__init__.py src/ci_triage/models.py _site/py/
          cp src/ci_triage/parsers/*.py _site/py/parsers/
          cp src/ci_triage/classifiers/*.py _site/py/classifiers/
          cp tests/fixtures/*.log _site/logs/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
