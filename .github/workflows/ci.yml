name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: python -m py_compile $(find src -name "*.py")

      - name: Test
        run: pytest tests/ -v --tb=short --cov=ci_triage --cov-report=xml

      - name: Demo (smoke test)
        run: |
          python -m ci_triage.cli analyze tests/fixtures/jenkins_failure.log \
            --source jenkins --build-id "ci-smoke-test"
          python -m ci_triage.cli analyze tests/fixtures/gha_failure.log \
            --source github --build-id "ci-smoke-test"
          python -m ci_triage.cli analyze tests/fixtures/xcodebuild_failure.log \
            --source xcodebuild --build-id "ci-smoke-test"
          python -m ci_triage.cli analyze tests/fixtures/jenkins_failure.log \
            --source jenkins --output json > /dev/null

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          fail_ci_if_error: false
